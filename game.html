<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<style>
  html, body { margin: 0; height: 100%; background: #12151c; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
// ---------- Settings: change these to rebalance the game ----------
const TILE = 48, COLS = 20, ROWS = 12;
const WAYPOINTS = [[0,2],[6,2],[6,8],[12,8],[12,3],[17,3],[17,10],[19,10]]; // [col,row] corners of the path
const TOWER_COST = 50, TOWER_RANGE = 150, TOWER_RATE = 500; // rate = ms between shots
const BULLET_SPEED = 420, BULLET_DAMAGE = 2;
const START_GOLD = 100, START_LIVES = 10, KILL_REWARD = 10;

// ---------- Build the set of path tiles from the waypoints ----------
const pathTiles = new Set();
for (let i = 0; i < WAYPOINTS.length - 1; i++) {
  let [c, r] = WAYPOINTS[i];
  const [c2, r2] = WAYPOINTS[i + 1];
  const dc = Math.sign(c2 - c), dr = Math.sign(r2 - r);
  pathTiles.add(c + "," + r);
  while (c !== c2 || r !== r2) { c += dc; r += dr; pathTiles.add(c + "," + r); }
}
const center = (col, row) => ({ x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 });

class Game extends Phaser.Scene {
  constructor() { super("Game"); }

  create() {
    this.gold = START_GOLD; this.lives = START_LIVES; this.wave = 0;
    this.enemies = []; this.towers = []; this.bullets = [];
    this.occupied = new Set();
    this.spawned = 0; this.waveSize = 0; this.waveActive = false; this.over = false;

    // Draw the map once
    const map = this.add.graphics();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const color = pathTiles.has(c + "," + r) ? 0x8a7a55 : ((c + r) % 2 ? 0x2a452e : 0x2d4a32);
        map.fillStyle(color, 1);
        map.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
    }
    this.overlay = this.add.graphics();            // hover highlight + range preview
    this.bars = this.add.graphics().setDepth(5);   // enemy health bars
    this.hud = this.add.text(8, 6, "", { fontFamily: "monospace", fontSize: "18px", color: "#ffffff" }).setDepth(10);
    this.updateHud();

    this.input.on("pointerdown", (p) => this.onClick(p));
    this.time.delayedCall(1500, () => this.startWave());
  }

  // ----- Waves -----
  startWave() {
    if (this.over) return;
    this.wave++;
    this.waveSize = 5 + this.wave * 2;
    this.waveHp = 4 + this.wave * 2;
    this.spawned = 0;
    this.waveActive = true;
    this.time.addEvent({ delay: 800, repeat: this.waveSize - 1, callback: () => this.spawnEnemy() });
    this.updateHud();
  }

  spawnEnemy() {
    this.spawned++;
    const p = center(...WAYPOINTS[0]);
    const rect = this.add.rectangle(p.x, p.y, 28, 28, 0xe5484d).setStrokeStyle(2, 0x000000, 0.4);
    this.enemies.push({ rect, hp: this.waveHp, maxHp: this.waveHp, target: 1, speed: 80, dead: false });
  }

  killEnemy(e) {
    e.dead = true;
    e.rect.destroy();
    this.enemies.splice(this.enemies.indexOf(e), 1);
    this.gold += KILL_REWARD;
    this.updateHud();
  }

  // ----- Building -----
  onClick(p) {
    if (this.over) { this.scene.restart(); return; }
    const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
    if (!this.canBuild(c, r)) return;
    const pos = center(c, r);
    this.add.rectangle(pos.x, pos.y, 34, 34, 0x4c8dff).setStrokeStyle(3, 0x1d3f7a);
    this.towers.push({ x: pos.x, y: pos.y, lastShot: 0 });
    this.occupied.add(c + "," + r);
    this.gold -= TOWER_COST;
    this.updateHud();
  }

  canBuild(c, r) {
    return c >= 0 && c < COLS && r >= 0 && r < ROWS &&
      !pathTiles.has(c + "," + r) && !this.occupied.has(c + "," + r) && this.gold >= TOWER_COST;
  }

  // ----- Main loop -----
  update(time, delta) {
    if (this.over) return;
    const dt = delta / 1000;

    // Move enemies along the path
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      const t = center(...WAYPOINTS[e.target]);
      const dx = t.x - e.rect.x, dy = t.y - e.rect.y;
      const dist = Math.hypot(dx, dy), step = e.speed * dt;
      if (dist <= step) {
        e.rect.setPosition(t.x, t.y);
        e.target++;
        if (e.target >= WAYPOINTS.length) {        // reached the exit
          e.dead = true;
          e.rect.destroy();
          this.enemies.splice(i, 1);
          this.lives--;
          this.updateHud();
          if (this.lives <= 0) { this.gameOver(); return; }
        }
      } else {
        e.rect.x += (dx / dist) * step;
        e.rect.y += (dy / dist) * step;
      }
    }

    // Towers shoot the first enemy in range (the one furthest along the path)
    for (const tw of this.towers) {
      if (time - tw.lastShot < TOWER_RATE) continue;
      const target = this.enemies.find((e) => Math.hypot(e.rect.x - tw.x, e.rect.y - tw.y) <= TOWER_RANGE);
      if (!target) continue;
      tw.lastShot = time;
      this.bullets.push({ circle: this.add.circle(tw.x, tw.y, 5, 0xffe066), target });
    }

    // Bullets chase their target
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      if (b.target.dead) { b.circle.destroy(); this.bullets.splice(i, 1); continue; }
      const dx = b.target.rect.x - b.circle.x, dy = b.target.rect.y - b.circle.y;
      const dist = Math.hypot(dx, dy), step = BULLET_SPEED * dt;
      if (dist <= step + 6) {
        b.target.hp -= BULLET_DAMAGE;
        b.circle.destroy();
        this.bullets.splice(i, 1);
        if (b.target.hp <= 0) this.killEnemy(b.target);
      } else {
        b.circle.x += (dx / dist) * step;
        b.circle.y += (dy / dist) * step;
      }
    }

    // Start the next wave once this one is cleared
    if (this.waveActive && this.spawned >= this.waveSize && this.enemies.length === 0) {
      this.waveActive = false;
      this.time.delayedCall(3000, () => this.startWave());
    }

    // Health bars + hover highlight
    this.bars.clear();
    for (const e of this.enemies) {
      this.bars.fillStyle(0x000000, 0.6);
      this.bars.fillRect(e.rect.x - 16, e.rect.y - 24, 32, 5);
      this.bars.fillStyle(0x46c36b, 1);
      this.bars.fillRect(e.rect.x - 16, e.rect.y - 24, 32 * (e.hp / e.maxHp), 5);
    }
    this.drawHover();
  }

  drawHover() {
    this.overlay.clear();
    const p = this.input.activePointer;
    const c = Math.floor(p.x / TILE), r = Math.floor(p.y / TILE);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    const ok = !pathTiles.has(c + "," + r) && !this.occupied.has(c + "," + r);
    this.overlay.fillStyle(ok ? 0x46c36b : 0xe5484d, 0.35);
    this.overlay.fillRect(c * TILE, r * TILE, TILE, TILE);
    if (ok) {
      const pos = center(c, r);
      this.overlay.lineStyle(2, 0xffffff, 0.35);
      this.overlay.strokeCircle(pos.x, pos.y, TOWER_RANGE);
    }
  }

  updateHud() {
    this.hud.setText(
      `Gold: ${this.gold}   Lives: ${this.lives}   Wave: ${this.wave}\n` +
      `Click a green tile to place a tower (${TOWER_COST} gold)`
    );
  }

  gameOver() {
    this.over = true;
    this.time.removeAllEvents();
    this.add.text(COLS * TILE / 2, ROWS * TILE / 2,
      `GAME OVER\nYou reached wave ${this.wave}\nClick to restart`,
      { fontFamily: "monospace", fontSize: "36px", color: "#ffffff", align: "center",
        backgroundColor: "#000000aa", padding: { x: 20, y: 14 } }
    ).setOrigin(0.5).setDepth(20);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: COLS * TILE,
  height: ROWS * TILE,
  parent: "game",
  backgroundColor: "#12151c",
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [Game],
});
</script>
</body>
</html>
