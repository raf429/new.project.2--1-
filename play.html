<!doctype html>
<!-- play.html: the page where the game runs. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the screen width on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play the game</title>
  <!-- The stylesheet that gives every page of the wiki the same look -->
  <link rel="stylesheet" href="style.css">

  <!-- Dark look for THIS page only (the rest of the wiki stays light).
       These rules come after style.css, so they win over it. -->
  <style>
    body {
      min-height: 100vh;
      background-color: #0d1017;                       /* dark page instead of white */
      /* a faint grid of blocks, to match the block map */
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      color: #cfd8ea;
      text-align: center;
    }
    h1 { color: #ffe066; margin: 0; padding: 0.6em 0 0.1em; border: none; }   /* gold title */
    a  { color: #7aa2ff; }                                                     /* light blue link */
    a:hover { color: #ffffff; }
    #game {
      border: 4px solid #2b3a55;                       /* frame around the game */
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 0 8px #151b28;   /* shadow and a second, darker frame */
    }
  </style>
</head>
<body>
  <h1>Play the game</h1>
  <p><a href="index.html">Back to the wiki page</a></p>

  <!-- The box the game appears in. script.js tells Phaser to use the element with id="game".
       The inline style keeps the box 860px wide at most, with the same shape as the game
       (aspect-ratio 960 / 660) and a dark background until the game has loaded. -->
  <div id="game" style="width:100%; max-width:860px; aspect-ratio:960 / 660; margin:1em auto; background:#12151c; overflow:hidden;"></div>

  <!-- ORDER MATTERS: Phaser (the game library, loaded from the internet) must come first,
       because script.js needs it. If these two lines are swapped you get "Phaser is not defined". -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <!-- Our own game code -->
  <script src="script.js"></script>
</body>
</html>
